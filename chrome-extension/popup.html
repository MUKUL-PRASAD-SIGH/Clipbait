<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .logo {
      font-size: 24px;
      margin-right: 10px;
    }
    
    .title {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
    }
    
    .status {
      display: flex;
      align-items: center;
      padding: 12px;
      background: #f0f9ff;
      border: 1px solid #0ea5e9;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    
    .status-icon {
      margin-right: 8px;
      font-size: 16px;
    }
    
    .status-text {
      font-size: 14px;
      color: #0369a1;
    }
    
    .recent-item {
      padding: 12px;
      background: #f8f9fa;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 12px;
      color: #495057;
      border-left: 3px solid #3b82f6;
    }
    
    .recent-time {
      font-size: 10px;
      color: #6b7280;
      margin-top: 4px;
    }
    
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    
    .btn {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    
    .btn:hover {
      background: #f3f4f6;
      border-color: #3b82f6;
    }
    
    .btn-primary {
      background: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }
    
    .btn-primary:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🤖</div>
    <div class="title">Epitychia AI</div>
  </div>
  
  <div class="status">
    <div class="status-icon">✅</div>
    <div class="status-text">Monitoring clipboard</div>
  </div>
  
  <div id="recent-items">
    <div class="recent-item">
      No recent clipboard activity
      <div class="recent-time">Waiting for clipboard changes...</div>
    </div>
  </div>
  
  <div class="actions">
    <button class="btn" id="open-app">Open App</button>
    <button class="btn btn-primary" id="test-popup">Test Popup</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
