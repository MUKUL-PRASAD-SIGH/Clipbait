<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      min-height: 400px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .subtitle {
      font-size: 14px;
      opacity: 0.8;
    }
    
    .login-form {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 500;
    }
    
    .form-input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      font-size: 14px;
      box-sizing: border-box;
    }
    
    .form-input:focus {
      outline: none;
      background: white;
    }
    
    .status {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    
    .status-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    
    .status-item:last-child {
      margin-bottom: 0;
    }
    
    .status-label {
      font-weight: 500;
    }
    
    .status-value {
      opacity: 0.8;
    }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 6px;
      padding: 12px 16px;
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .btn-primary {
      background: rgba(255, 255, 255, 0.9);
      color: #667eea;
    }
    
    .btn-primary:hover {
      background: white;
    }
    
    .btn-danger {
      background: rgba(220, 53, 69, 0.8);
    }
    
    .btn-danger:hover {
      background: rgba(220, 53, 69, 1);
    }
    
    .recent-items {
      margin-top: 20px;
    }
    
    .recent-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    .recent-item {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 13px;
      line-height: 1.4;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .recent-item:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .recent-item:last-child {
      margin-bottom: 0;
    }
    
    .timestamp {
      font-size: 11px;
      opacity: 0.6;
      margin-top: 5px;
    }
    
    .hidden {
      display: none;
    }
    
    .error {
      background: rgba(220, 53, 69, 0.2);
      border: 1px solid rgba(220, 53, 69, 0.5);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 14px;
    }
    
    .success {
      background: rgba(40, 167, 69, 0.2);
      border: 1px solid rgba(40, 167, 69, 0.5);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🎯 Epitychia</div>
    <div class="subtitle">Smart Clipboard Assistant</div>
  </div>
  
  <!-- Login Form (shown when not authenticated) -->
  <div id="loginSection" class="hidden">
    <div class="login-form">
      <div id="loginError" class="error hidden"></div>
      <div class="form-group">
        <label class="form-label">Email:</label>
        <input type="email" class="form-input" id="email" placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label class="form-label">Password:</label>
        <input type="password" class="form-input" id="password" placeholder="Enter your password">
      </div>
      <button class="btn btn-primary" id="loginBtn">Login</button>
    </div>
  </div>
  
  <!-- Main Interface (shown when authenticated) -->
  <div id="mainSection" class="hidden">
    <div class="status">
      <div class="status-item">
        <span class="status-label">Status:</span>
        <span class="status-value" id="status">Loading...</span>
      </div>
      <div class="status-item">
        <span class="status-label">Items Captured:</span>
        <span class="status-value" id="itemCount">0</span>
      </div>
      <div class="status-item">
        <span class="status-label">Last Activity:</span>
        <span class="status-value" id="lastActivity">Never</span>
      </div>
    </div>
    
    <div class="actions">
      <button class="btn btn-primary" id="openDashboard">Open Dashboard</button>
      <button class="btn" id="captureNow">Capture Current Clipboard</button>
      <button class="btn" id="viewHistory">View History</button>
      <button class="btn btn-danger" id="logoutBtn">Logout</button>
    </div>
    
    <div class="recent-items">
      <div class="recent-title">Recent Items</div>
      <div id="recentList">
        <div class="recent-item">Loading...</div>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
